<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPARTAN Command Dashboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Chief (Voice), ElevenLabs Conversational AI widget. The agent is private
         (spartan-muse docs/design/voice-auth.md): the widget starts from a signed URL that muse
         mints through Sentinel, valid 15 minutes to start, so it is fetched on load and
         refreshed every 10 minutes. No agent id on this page. -->
    <script>
      (function () {
        async function refreshSignedUrl() {
          try {
            const r = await fetch("/api/voice/signed-url", { credentials: "same-origin", cache: "no-store" });
            if (!r.ok) { console.warn("Chief (Voice): signed URL refused", r.status); return; }
            const { signed_url } = await r.json();
            let el = document.querySelector("elevenlabs-convai");
            if (!el) { el = document.createElement("elevenlabs-convai"); document.body.appendChild(el); }
            el.setAttribute("signed-url", signed_url);
          } catch (e) { console.warn("Chief (Voice): signed URL unavailable"); }
        }
        refreshSignedUrl();
        setInterval(refreshSignedUrl, 10 * 60 * 1000);
      })();
    </script>
    <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>
  </body>
</html>
