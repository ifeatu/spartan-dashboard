server {
    listen 80;
    server_name _;

    # auth_basic is intentionally NOT set at server level.
    #
    # Background: when auth_basic is inherited by every location, the browser
    # presents a login dialog for each XHR that lacks credentials — ~29 polling
    # endpoints × poll interval = a dialog storm that cannot be dismissed cleanly
    # (repro: Chrome credential cache cleared after browser update/restart).
    #
    # Fix: guard only the SPA shell (loaded once) with auth_basic. All /api/*
    # locations are unauthenticated here; they proxy to internal NAS services
    # already unreachable from the public internet. The SPA gate is sufficient.

    # Unauthenticated health probe for Docker healthcheck
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # SPA static files — auth gate: must log in once to load the app
    location / {
        auth_basic "SPARTAN Command";
        auth_basic_user_file /etc/nginx/.htpasswd;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Static assets with long cache — also guarded so assets can't be scraped
    location /assets/ {
        auth_basic "SPARTAN Command";
        auth_basic_user_file /etc/nginx/.htpasswd;
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Core Agents ──────────────────────────────────────
    location /api/health/chief {
        proxy_pass http://192.168.1.19:8752/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/health/scribe {
        proxy_pass http://192.168.1.19:8742/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin *;
    }

    # ── Domain Agents ─────────────────────────────────────
    location /api/health/bob {
        proxy_pass http://192.168.1.19:8755/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/health/susan {
        proxy_pass http://192.168.1.19:8756/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/health/cycleforge {
        proxy_pass http://192.168.1.19:8743/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/health/coach {
        proxy_pass http://192.168.1.19:8744/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/health/iris {
        proxy_pass http://192.168.1.19:8761/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/health/ifeoma {
        proxy_pass http://192.168.1.19:8758/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin *;
    }


    # ── Bob build queue (real-time dashboard panel) ──────
    # /queue/summary is live today. /queue/list + /debt/list arrive when
    # queue item #144 lands; the React panel auto-detects via 404 probe.
    # CCP 8 (2026-09-26): the ElevenLabs voice agent's send_to_fleet posts here. muse-engine
    # has no public hostname of its own and the tunnel is remote-managed, so this hostname
    # carries the one path. No auth_basic: muse checks its own credential (Chief's service
    # token or MUSE_VOICE_TOKEN) and answers 401 otherwise. Cloudflare's headers pass through,
    # so muse's tunnel fence still limits what a tunnel request can reach. POST only.
    # Chief (Voice) behind auth (spartan-muse docs/design/voice-auth.md): the widget no longer
    # carries the agent id; it starts from a 15-minute signed URL. Behind the same basic auth as the
    # page (the browser reuses the page's credentials), and muse-voice-auth.conf (NAS only, mode
    # 600) sets the bearer that alone opens muse's GET /voice/signed-url. GET only, no body.
    location = /api/voice/signed-url {
        auth_basic "SPARTAN Command";
        auth_basic_user_file /etc/nginx/.htpasswd;
        limit_except GET { deny all; }
        proxy_pass http://192.168.1.19:8774/voice/signed-url;
        proxy_http_version 1.1;
        include /etc/nginx/muse-voice-auth.conf;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
        add_header Cache-Control "no-store" always;
    }

    location = /voice {
        limit_except POST { deny all; }
        proxy_pass http://192.168.1.19:8774/voice;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_request_headers on;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }

    location = /api/bob/queue/summary {
        proxy_pass http://192.168.1.19:8755/queue/summary;
        include /etc/nginx/bob-auth.conf;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/bob/queue/list {
        proxy_pass http://192.168.1.19:8755/queue/list$is_args$args;
        include /etc/nginx/bob-auth.conf;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/bob/queue/recent {
        proxy_pass http://192.168.1.19:8755/queue/recent$is_args$args;
        include /etc/nginx/bob-auth.conf;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/bob/debt/list {
        proxy_pass http://192.168.1.19:8755/debt/list$is_args$args;
        include /etc/nginx/bob-auth.conf;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin *;
    }
    # Direct CCPs panel (debt #705): bob_run_ccp(queue_id=0) dispatches never
    # get a build_queue row, so /queue/list can never show them even when
    # bob_ccp_reap confirms pid_alive=true — an operator reads the blank
    # dashboard as "job not running". /ccp/direct is not deployed on bob-mcp
    # yet (companion change); this panel 404-probes it the same way the
    # /queue/list and /debt/list panels above do and auto-upgrades once it lands.
    location /api/bob/ccp/direct {
        proxy_pass http://192.168.1.19:8755/ccp/direct$is_args$args;
        include /etc/nginx/bob-auth.conf;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin *;
    }
    location ~ ^/api/bob/queue/([0-9]+)/decision$ {
        proxy_pass http://192.168.1.19:8755/queue/$1/decision;
        include /etc/nginx/bob-auth.conf;
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
        proxy_set_header Host $host;
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin *;
    }
    location = /api/bob/queue/breaker/clear {
        proxy_pass http://192.168.1.19:8755/queue/breaker/clear;
        include /etc/nginx/bob-auth.conf;
        proxy_connect_timeout 5s;
        proxy_read_timeout    20s;
        proxy_set_header Host $host;
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin *;
    }
    location = /api/bob/queue/seed-debt {
        proxy_pass http://192.168.1.19:8755/queue/seed-debt;
        include /etc/nginx/bob-auth.conf;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_set_header Host $host;
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin *;
    }

    # ── Infrastructure ────────────────────────────────────
    location /api/health/chromadb {
        proxy_pass http://192.168.1.19:8200/api/v2/heartbeat;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin *;
    }
}
