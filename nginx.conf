server {
    listen 80;
    server_name _;

    auth_basic "SPARTAN Command";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Unauthenticated health probe for Docker healthcheck
    location = /healthz {
        auth_basic off;
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # SPA static files
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Static assets with long cache
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Core Agents ──────────────────────────────────────
    location /api/health/chief {
        proxy_pass http://192.168.1.19:8752/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/health/scribe {
        proxy_pass http://192.168.1.19:8742/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/health/forge {
        proxy_pass http://192.168.1.19:8768/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }

    # ── Domain Agents ─────────────────────────────────────
    location /api/health/bob {
        proxy_pass http://192.168.1.19:8755/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/health/susan {
        proxy_pass http://192.168.1.19:8756/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/health/cycleforge {
        proxy_pass http://192.168.1.19:8743/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/health/coach {
        proxy_pass http://192.168.1.19:8744/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/health/iris {
        proxy_pass http://192.168.1.19:8761/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/health/ifeoma {
        proxy_pass http://192.168.1.19:8758/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/health/comply {
        proxy_pass http://192.168.1.19:8760/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/health/erlai {
        proxy_pass http://192.168.1.19:8771/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }

    # ── ERLAI CCI Platform ────────────────────────────────
    location /api/health/erlai-gw {
        proxy_pass http://192.168.1.19:8800/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/health/erlai-ingest {
        proxy_pass http://192.168.1.19:8801/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/health/erlai-score {
        proxy_pass http://192.168.1.19:8802/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/health/erlai-orch {
        proxy_pass http://192.168.1.19:8803/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/health/erlai-transform {
        proxy_pass http://192.168.1.19:8804/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/health/erlai-web {
        proxy_pass http://192.168.1.19:3100/;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/health/erlai-grafana {
        proxy_pass http://192.168.1.19:3002/api/health;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }

    # ── Bob build queue (real-time dashboard panel) ──────
    # /queue/summary is live today. /queue/list + /debt/list arrive when
    # queue item #144 lands; the React panel auto-detects via 404 probe.
    location = /api/bob/queue/summary {
        proxy_pass http://192.168.1.19:8755/queue/summary;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/bob/queue/list {
        proxy_pass http://192.168.1.19:8755/queue/list$is_args$args;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/bob/queue/recent {
        proxy_pass http://192.168.1.19:8755/queue/recent$is_args$args;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/bob/debt/list {
        proxy_pass http://192.168.1.19:8755/debt/list$is_args$args;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
    location ~ ^/api/bob/queue/([0-9]+)/decision$ {
        proxy_pass http://192.168.1.19:8755/queue/$1/decision;
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
        proxy_set_header Host $host;
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
        add_header Access-Control-Allow-Origin *;
    }
    location = /api/bob/queue/breaker/clear {
        proxy_pass http://192.168.1.19:8755/queue/breaker/clear;
        proxy_connect_timeout 5s;
        proxy_read_timeout    20s;
        proxy_set_header Host $host;
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
        add_header Access-Control-Allow-Origin *;
    }
    location = /api/bob/queue/seed-debt {
        proxy_pass http://192.168.1.19:8755/queue/seed-debt;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_set_header Host $host;
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
        add_header Access-Control-Allow-Origin *;
    }

    # ── Infrastructure ────────────────────────────────────
    location /api/health/chromadb {
        proxy_pass http://192.168.1.19:8200/api/v1/heartbeat;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
}
